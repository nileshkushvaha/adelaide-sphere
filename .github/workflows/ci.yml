# Continuous integration (SRS OPS 002). Installs from the frozen lockfile,
# checks the code, then runs the integration suites against real MySQL and
# Redis services. Migrations are applied exactly once per job, never from
# application startup.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 12.3.4

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Generate the database client
        run: pnpm db:build
      - name: Build the shared packages (domain, mail)
        run: pnpm domain:build && pnpm mail:build
      - name: Migration policy
        run: pnpm db:migrations:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: API end-to-end tests
        run: pnpm test:e2e
      - name: Build
        run: pnpm build
      - name: Bundle budget
        run: pnpm budget
      - name: Contracts are in sync with the API
        run: pnpm contracts:check

  integration:
    name: Integration tests (MySQL + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: adelaide_sphere_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -p$MYSQL_ROOT_PASSWORD"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:8.4.6
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      # CI-only credentials for throwaway service containers; production secrets
      # never live in this file.
      DATABASE_URL: mysql://root:ci-root-password@127.0.0.1:3306/adelaide_sphere_test
      TEST_DATABASE_URL: mysql://root:ci-root-password@127.0.0.1:3306/adelaide_sphere_test
      SHADOW_DATABASE_URL: mysql://root:ci-root-password@127.0.0.1:3306/adelaide_sphere_shadow
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:build
      - run: pnpm domain:build && pnpm mail:build
      - name: Apply migrations once
        run: pnpm db:migrate:deploy
      - name: Integration tests
        run: pnpm test:integration

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails the job on a high or critical advisory; moderate findings are
      # reported and triaged rather than blocking every build. The ignored IDs
      # are the four accepted in docs/security/dependency-advisories.md, each
      # with its mitigation and the upstream release that removes it; any other
      # high advisory still fails. Remove an ID as soon as its row is dropped.
      - name: Audit production dependencies
        run: >-
          pnpm audit --prod --audit-level high
          --ignore GHSA-cqhc-2h57-wpxf
          --ignore GHSA-3f6p-5ww8-9rcr
          --ignore GHSA-j3q9-mxjg-w52f
          --ignore GHSA-ggr8-5vv4-36mx

  browser:
    # Post-audit remediation (F-09): the release gate's browser leg. Prepared,
    # not connected to any external account — it runs entirely on the runner,
    # brings up this project's own Compose services, and provisions its own
    # throwaway administrator with a generated password.
    #
    # It uses Compose rather than GitHub service containers because
    # `scripts/test-browser.mjs` creates and drops its database through the
    # project's own MySQL container, so CI and a developer's machine run the
    # identical path.
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Local service credentials (placeholders; nothing here is a secret)
        run: |
          cp infrastructure/.env.example infrastructure/.env
          cp apps/api/.env.example apps/api/.env
      - name: Start MySQL and Redis
        run: pnpm infra:up
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:build
      - run: pnpm domain:build && pnpm mail:build
      - run: pnpm build
      - name: Install the browser
        run: pnpm --filter @adelaide-sphere/e2e exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm test:browser
      - name: Failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
