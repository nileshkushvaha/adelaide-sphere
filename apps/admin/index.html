<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light" />
    <title>Adelaide Sphere Admin</title>
    <style>
      /*
        Boot loader: the admin is a single-page application, so the first paint
        happens before any script has run. This is plain markup in the document,
        removed once React has mounted, so the operator sees the product working
        rather than a white page on a slow connection.
      */
      #app-boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #f5f7fa; color: #4b5563; font: 14px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      #app-boot .spinner { width: 34px; height: 34px; border: 3px solid #d6dee8; border-top-color: #1668dc; border-radius: 50%; animation: app-boot-spin 0.9s linear infinite; }
      @keyframes app-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #app-boot .spinner { animation-duration: 3s; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-boot" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p>Loading Adelaide Sphere Admin…</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
