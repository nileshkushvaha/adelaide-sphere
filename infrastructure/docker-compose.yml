# Adelaide Sphere — local development infrastructure (MySQL, Redis, MinIO, Mailpit).
#
# Run from the repository root via the pnpm scripts (pnpm infra:up / infra:down /
# infra:status / infra:logs), which pass this file and infrastructure/.env
# explicitly. Credentials come from infrastructure/.env (git-ignored); the
# tracked template is infrastructure/.env.example.
#
# Ports are published on 127.0.0.1 only. Volumes are named and survive
# `docker compose down`; only `down --volumes` deletes data (destructive, never
# part of routine setup).

name: adelaide-sphere

services:
  mysql:
    # MySQL 8.4 LTS (supported to 2032, listed as supported by Prisma). Multi-arch
    # image (amd64 + arm64). Pinned patch release; bump deliberately.
    image: mysql:8.4.11
    container_name: adelaide-sphere-mysql
    restart: unless-stopped
    # utf8mb4 everywhere (SRS ARC 003 / DAT 001). Collation policy (Phase 8):
    # utf8mb4_unicode_ci for the server default, every database and every
    # Prisma-managed table, so no mixed-collation comparisons can occur.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      # NOTE: these MYSQL_* variables are only read by the image's init script
      # when the data volume is EMPTY (first start). Changing them later does
      # not change existing users, passwords or databases.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in infrastructure/.env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set in infrastructure/.env}
      MYSQL_USER: ${MYSQL_USER:?set in infrastructure/.env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in infrastructure/.env}
      # Root is only reachable from inside the container; no remote root user.
      MYSQL_ROOT_HOST: localhost
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3317}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # First-start-only init scripts (shadow database for Prisma Migrate).
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    networks:
      - local
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    # Redis 8.4 line (maintained, multi-arch). BullMQ needs Redis >= 6.2.
    image: redis:8.4.6
    container_name: adelaide-sphere-redis
    restart: unless-stopped
    # Persistence (AOF + RDB) and noeviction so BullMQ job data is never
    # silently dropped (SRS OPS 003). One instance serves cache and queue
    # locally; production isolation of cache vs queue Redis is a later decision
    # (SRS CACHE 003).
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set in infrastructure/.env}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "60 1000"
      - --maxmemory-policy
      - noeviction
    environment:
      # Lets the healthcheck authenticate without putting the password in argv.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6390}:6379"
    volumes:
      - redis-data:/data
    networks:
      - local
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  adminer:
    # Development-only browser UI for the local database (http://127.0.0.1:8092).
    # Lives on the internal network so it can reach the mysql service by name.
    # Not part of any production deployment.
    image: adminer:5.5.1
    container_name: adelaide-sphere-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "127.0.0.1:${ADMINER_HOST_PORT:-8092}:8080"
    networks:
      - local
    depends_on:
      mysql:
        condition: service_healthy

  minio:
    # S3-compatible object storage for media (SRS ARC 003). The API and worker
    # talk to it with the same S3 client they will use in production, so the
    # storage adapter is exercised for real locally. Host ports 9020/9021 are
    # used because 9000 is commonly taken (php-fpm on this machine).
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: adelaide-sphere-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in infrastructure/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in infrastructure/.env}
      # Buckets are created by the application at start-up; nothing is public by
      # default, and the quarantine bucket never becomes readable.
      MINIO_BROWSER_REDIRECT_URL: http://127.0.0.1:${MINIO_CONSOLE_PORT:-9021}
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9020}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9021}:9001"
    volumes:
      - minio-data:/data
    networks:
      - local
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  mailpit:
    # Local SMTP catcher (SRS ENQ 005 / decision D03). The API and worker use
    # the same SMTP adapter they use in production, pointed at this relay, so
    # password-reset and enquiry mail can be read at http://127.0.0.1:8035
    # instead of being printed to a console. Nothing here ever leaves the
    # machine: Mailpit accepts messages and stores them; it does not relay.
    # Development only; production requires an authenticated TLS relay.
    image: axllent/mailpit:v1.31.1
    container_name: adelaide-sphere-mailpit
    restart: unless-stopped
    environment:
      # Persist captured mail across restarts and cap the store.
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "5000"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1035}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8035}:8025"
    volumes:
      - mailpit-data:/data
    networks:
      - local
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  # Compose prefixes these with the project name: adelaide-sphere_mysql-data,
  # adelaide-sphere_redis-data, adelaide-sphere_minio-data,
  # adelaide-sphere_mailpit-data.
  mysql-data:
  redis-data:
  minio-data:
  mailpit-data:

networks:
  # Internal bridge for service-to-service traffic; host access is via the
  # loopback-published ports only.
  local:
    driver: bridge
