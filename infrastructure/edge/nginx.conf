# Adelaide Sphere — reverse-proxy reference configuration.
#
# Purpose (audit F-05): Next.js 16 begins streaming the response body as soon as
# a Suspense boundary renders, so `notFound()` raised after that point cannot
# replace a body that is already on the wire. The status and the metadata are
# correct; the body is empty. The prerendered document Next.js already produces
# (`.next/server/app/_not-found.html`) is the right page — it only has to be
# served. That is what this configuration does, at the edge, where it costs one
# static file read and cannot fail.
#
# This is a reference configuration: the production edge (nginx, a managed load
# balancer, or a CDN) is not chosen yet. Adapting the two directives that matter
# — intercept the upstream's 404 and answer it with this file, preserving the
# status — is a staging task, recorded as such.

worker_processes  1;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  # Upstreams. In a deployed environment these are service names on the internal
  # network; here they are the host's ports.
  upstream ms_web   { server ${MS_WEB_UPSTREAM}; }
  upstream ms_api   { server ${MS_API_UPSTREAM}; }
  upstream ms_admin { server ${MS_ADMIN_UPSTREAM}; }

  server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    # The API owns its own 404s: they are JSON envelopes carrying a requestId,
    # and replacing one with an HTML page would break every client. Interception
    # is off here, explicitly, so a future edit to the server block cannot leak
    # into it.
    location /api/v1/ {
      proxy_intercept_errors off;
      proxy_pass http://ms_api;
    }

    # The admin application is a single-page app that resolves its own unknown
    # routes; it must not be handed the public site's not-found page.
    location /admin/ {
      proxy_intercept_errors off;
      proxy_pass http://ms_admin;
    }

    # Never rewrite a 404 for an asset: a missing script or image must stay a
    # missing asset, not a 55 KB HTML document with the wrong content type.
    location /_next/ {
      proxy_intercept_errors off;
      proxy_pass http://ms_web;
    }

    # The public site. A 404 from the application is answered with the document
    # the application itself prerendered.
    location / {
      proxy_intercept_errors on;
      # No "=" before the named location: the original 404 status is preserved.
      # With "=" nginx would answer 200, which is the failure this exists to avoid.
      error_page 404 @not_found;
      proxy_pass http://ms_web;
    }

    location @not_found {
      internal;
      root /usr/share/nginx/not-found;
      default_type text/html;
      add_header Cache-Control "no-store" always;
      add_header X-Robots-Tag "noindex" always;
      try_files /_not-found.html =404;
    }
  }
}
